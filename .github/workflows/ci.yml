name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: xvfb-run --auto-servernum npm test
      - run: npm run inspect:package
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsquote-vsix
          path: vsquote.vsix
          if-no-files-found: error
